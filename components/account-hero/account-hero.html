<section class="money-hero" aria-label="Account summary">
  <div class="money-hero__profile">
    <img class="money-hero__avatar" src="assets/images/achievements/spiderman-avatar.svg" alt="Spiderman profile" />
    <div>
      <p class="money-hero__hi">Hi, <span data-auth-name>Player</span></p>
      <p class="money-hero__sum">
        <span data-money-currency>MYR</span> <span data-money-balance>0.00</span>
        <button type="button" class="money-icon-btn" data-money-refresh aria-label="Refresh balance">
          <span data-icon="refresh"></span>
        </button>
      </p>
      <a class="money-hero__wallet" href="account.html?view=transfer">View Full Wallet</a>
      <div class="money-hero__flags">
        <span class="money-verified"><span data-icon="mail" aria-hidden="true"></span> Verified</span>
        <span class="money-verified"><span data-icon="phone" aria-hidden="true"></span> Verified</span>
      </div>
    </div>
  </div>
  <div class="money-stats">
    <article class="money-stat">
      <p class="money-stat__k">VIP</p>
      <span class="money-stat__icon" data-icon="trophy" aria-hidden="true"></span>
      <p class="money-stat__v" data-auth-vip>Bronze</p>
    </article>
    <article class="money-stat">
      <p class="money-stat__k">MYR Amount Required For Upgrade</p>
      <span class="money-stat__icon" data-icon="coin" aria-hidden="true"></span>
      <p class="money-stat__v" data-money-required>0.00</p>
    </article>
    <article class="money-stat">
      <p class="money-stat__k">MYR Withdrawal Limit</p>
      <span class="money-stat__icon" data-icon="coin" aria-hidden="true"></span>
      <p class="money-stat__v" data-money-limit>0.00</p>
    </article>
    <article class="money-stat">
      <p class="money-stat__k">Time Withdrawal Frequency</p>
      <span class="money-stat__icon" data-icon="clock" aria-hidden="true"></span>
      <p class="money-stat__v" data-money-freq>4</p>
    </article>
    <article class="money-stat">
      <p class="money-stat__k">Registration Date</p>
      <span class="money-stat__icon" data-icon="calendar" aria-hidden="true"></span>
      <p class="money-stat__v" data-money-registered>—</p>
    </article>
  </div>
</section>
