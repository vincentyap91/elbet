<div class="modal" data-modal-root hidden>
  <div class="modal__backdrop" data-action="modal-close"></div>
  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-ref="dialog">
    <div class="modal__header">
      <h2 class="modal__title" id="modal-title" data-ref="title"></h2>
      <ui-icon-button name="close" label="Close" data-action="modal-close"></ui-icon-button>
    </div>
    <div class="modal__body" data-ref="body"></div>
    <div class="modal__footer" data-ref="footer"></div>
  </div>
</div>
