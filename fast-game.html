<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ELBET · Fast Game</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("elbet:theme") || "dark";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-layout="shell">
    <div data-include="header"></div>
    <div data-include="sidebar"></div>
    <main id="main" class="page page--inner page--catalog page--fast-game" data-page="fast-game">
      <div class="shell-main">
        <div class="event-hero">
          <h1 class="sr-only">Fast Game</h1>
          <img class="event-hero__image" src="assets/images/fast-game/hero.webp" alt="Fast Game. Quick rounds, non-stop excitement." />
        </div>
        <header class="catalog-head">
          <img class="catalog-head__icon" src="assets/images/menu/icon-fast-game.svg" alt="" />
          <h2 class="catalog-head__title">Fast Game</h2>
        </header>
        <section class="catalog-section catalog-browse" aria-labelledby="fast-browse-title">
          <h2 class="sr-only" id="fast-browse-title">Browse fast games</h2>
          <div class="catalog-browse__toolbar">
            <div class="catalog-browse__filters">
              <div class="catalog-browse__hot-label">
                <img src="assets/images/slots/hotgames.png" alt="" width="24" height="24" />
                <span>HOT GAMES</span>
              </div>
              <div class="event-pills catalog-browse__hot" role="tablist" aria-label="Hot games" data-catalog-pills></div>
            </div>
            <label class="catalog-search">
              <img class="catalog-search__icon" src="assets/images/icons/icon-search.svg" alt="" width="16" height="16" />
              <span class="sr-only">Search games</span>
              <input type="search" data-catalog-search placeholder="Search" autocomplete="off" />
            </label>
          </div>
          <div class="game-grid" data-catalog-games></div>
        </section>
        <div data-include="transactions"></div>
      </div>
    </main>
    <div data-include="footer"></div>
    <div data-include="chat"></div>
    <div data-include="mobile-nav"></div>
    <div data-include="modal"></div>
    <div data-include="toast"></div>
    <script src="js/boot.js"></script>
  </body>
</html>
